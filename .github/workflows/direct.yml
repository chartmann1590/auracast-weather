name: Direct download build (Stripe) + emulator test
# Direct-download build of this app (GitHub Releases / charleshartmann.com): same code, built with -Pstore=direct
# (Stripe Checkout instead of Google Play Billing, no Google Play links, no Play review prompt).
# Branch builds only make a DRAFT release; nothing is uploaded to any store.
on:
  push:
    branches: [direct-stripe]
  workflow_dispatch:
    inputs:
      steps:
        description: steps file under .github/direct (steps-release.txt or steps-restore.txt)
        default: steps-release.txt
permissions:
  contents: write
concurrency:
  group: direct-${{ github.ref }}
  cancel-in-progress: true
jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
    - uses: actions/checkout@v4
    - name: Verify Play secrets present
      run: |
        missing=0
        for v in PLAY_SERVICE_ACCOUNT_JSON KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
          if [ -z "${!v}" ]; then echo "::warning::Secret $v is empty — Play publish will fail without it"; missing=1; fi
        done
        # AdMob secrets are optional for build (falls back to test IDs) but warn
        for v in ADMOB_APP_ID ADMOB_BANNER_ID ADMOB_INTERSTITIAL_ID; do
          if [ -z "${!v}" ]; then echo "::notice::AdMob secret $v empty — release will use test IDs (ok for forks)"; fi
        done
        if [ "$missing" = "1" ]; then echo "::error::Missing Play signing/service secrets — check Settings → Secrets → Actions"; fi
    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Decode upload keystore
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then echo "No KEYSTORE_BASE64"; exit 1; fi
        echo "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > upload-keystore.jks
        echo "Keystore decoded: $(wc -c < upload-keystore.jks) bytes"
        # Also ensure keystore.properties is not needed — build.gradle reads env vars + file existence
    - name: Verify no hardcoded AdMob IDs
      run: |
        ALLOWED_TEST_ID="3940256099942544"
        FOUND=$(git grep -E "ca-app-pub-[0-9]+[~/][0-9]+" -- ':!local.properties' 2>/dev/null | grep -v "$ALLOWED_TEST_ID" || true)
        if [ -n "$FOUND" ]; then echo "::error::Non-test AdMob ID leaked"; echo "$FOUND"; exit 1; fi
        echo "AdMob check OK"
    - name: Build direct APK (store=direct)
      env: {}
      run: |
        set -o pipefail
        chmod +x gradlew
        ./gradlew assembleRelease -Pstore=direct --stacktrace 2>&1 | tee -a /tmp/dsk-build.log
        cd "$GITHUB_WORKSPACE"
        mkdir -p dsk-apk
        A=$(find . -path "*/build/outputs/apk/*release*/*.apk" ! -name "*unsigned*" | head -1); [ -z "$A" ] && A=$(find . -path "*/build/outputs/apk/*release*/*.apk" | head -1)
        cp "$A" dsk-apk/AuraCastWeather-direct-release.apk
        ls -la dsk-apk
        BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
        $BT/apksigner verify --print-certs dsk-apk/AuraCastWeather-direct-release.apk | head -3 || true
        $BT/aapt2 dump badging dsk-apk/AuraCastWeather-direct-release.apk | head -3 || true
        echo "--- Play Store URL strings left in the direct release dex:"; unzip -p dsk-apk/AuraCastWeather-direct-release.apk "classes*.dex" | strings | grep -E "play\.google\.com/store|market://" | head || true
    - name: Ship build log tail to the private drop (on failure)
      if: failure()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        tail -c 60000 /tmp/dsk-build.log 2>/dev/null | curl -s -m 60 -X PUT -H "X-Key: $DROP_KEY" --data-binary @- "https://hs-apk-drop.charles-h-hartmann1.workers.dev/c/dsklog_${{ github.event.repository.name }}_r${{ github.run_number }}/0" || true
    - name: Free runner disk for the emulator
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium || true
        df -h / | tail -1
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
    - name: Emulator test (phone, Google APIs, no Play Store)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        profile: pixel_5
        target: google_apis
        arch: x86_64
        ram-size: 3072M
        disk-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: STEPS_FILE=${{ github.event.inputs.steps || 'steps-release.txt' }} bash .github/direct/run-tests.sh
    - name: Upload test results to Tab's private drop
      if: always()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        # The signed APK rides along (private drop, key-protected, 48 h TTL) so it can be device-tested before the draft is published.
        mkdir -p /tmp/dsk-out && cp dsk-apk/*.apk /tmp/dsk-out/ 2>/dev/null || true
        bash .github/direct/direct-upload.sh /tmp/dsk-out dsk_AuraCastWeather_r${{ github.run_number }}
    - name: Draft release with the direct APK (not published)
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: direct-${{ github.run_number }}
        name: Direct build ${{ github.run_number }} (${{ github.sha }})
        draft: true
        files: dsk-apk/AuraCastWeather-direct-release.apk
