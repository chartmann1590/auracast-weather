name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    # AdMob real IDs are injected ONLY via GitHub Secrets — never hardcoded in repo.
    # See app/build.gradle.kts for resolution order: env var (CI) → local.properties → fallback test ID.
    # Debug builds ALWAYS use Google test IDs; release builds use these secrets when present.
    env:
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Verify no hardcoded real AdMob IDs in repo (secrets must not be committed)
        run: |
          echo "Checking that no production AdMob IDs are hardcoded in tracked files..."
          # Only Google's public TEST IDs are allowed in tracked files. Any other ca-app-pub- is a leak.
          # Test allow-list: 3940256099942544 (Google's official test publisher ID — see https://developers.google.com/admob/android/test-ads)
          ALLOWED_TEST_ID="3940256099942544"
          FOUND=$(git grep -E "ca-app-pub-[0-9]+[~/][0-9]+" -- ':!local.properties' 2>/dev/null | grep -v "$ALLOWED_TEST_ID" || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Non-test AdMob ID found hardcoded in repository! Production IDs must ONLY live in GitHub Secrets + local.properties (gitignored)."
            echo "$FOUND"
            exit 1
          fi
          echo "No non-test AdMob IDs in tracked files — OK."
          # Also ensure admob.* properties are not in any committed file other than local.properties (gitignored)
          # Property names may appear in docs, the .example file and build.gradle.kts; only a real (non-test) ID assigned to one is a leak.
          LEAKED_PROPS=$(git grep -nE "admob\.(appId|bannerId|interstitialId)[[:space:]]*=[[:space:]]*ca-app-pub-[0-9]" -- ':!local.properties' 2>/dev/null | grep -v "$ALLOWED_TEST_ID" || true)
          if [ -n "$LEAKED_PROPS" ]; then
            echo "::error::admob.* entry found in a committed file. Those must only be in local.properties (gitignored)."
            echo "$LEAKED_PROPS"
            exit 1
          fi
          echo "Secrets file check passed."
      - name: Build debug (TEST ads) + lint + unit tests
        run: ./gradlew assembleDebug lint testDebugUnitTest --stacktrace
      - name: Build release (REAL ads when secrets present, else test fallback)
        run: ./gradlew assembleRelease --stacktrace
      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
